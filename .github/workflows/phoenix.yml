name: Phoenix x86_64 CI

on:
  push:
    branches:
      - codex/phoenix-probe
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
      - name: Build matching Lilu debug dependency
        run: |
          ln -s ../MacKernelSDK Lilu/MacKernelSDK
          cd Lilu
          xcodebuild -jobs 1 -configuration Debug -arch x86_64 build
      - name: Embed AMD Phoenix firmware binary
        run: |
          xxd -i -n phoenix_sdma_6_0_1 NootedRed/Firmware/phoenix_sdma_6_0_1.bin \
            > NootedRed/PhoenixFirmwareSDMAGenerated.hpp
          xxd -i -n phoenix_gc_11_0_1_imu NootedRed/Firmware/gc_11_0_1_imu.bin \
            > NootedRed/PhoenixFirmwareIMUGenerated.hpp
          : > NootedRed/PhoenixFirmwareGFXGenerated.hpp
          for component in pfp me mec rlc; do
            xxd -i -n "phoenix_gc_11_0_1_${component}" \
              "NootedRed/Firmware/gc_11_0_1_${component}.bin" \
              >> NootedRed/PhoenixFirmwareGFXGenerated.hpp
          done
          sed -i '' 's/^unsigned char/static const unsigned char/; s/^unsigned int/static const unsigned int/' \
            NootedRed/PhoenixFirmwareSDMAGenerated.hpp
          sed -i '' 's/^unsigned char/static const unsigned char/; s/^unsigned int/static const unsigned int/' \
            NootedRed/PhoenixFirmwareIMUGenerated.hpp
          sed -i '' 's/^unsigned char/static const unsigned char/; s/^unsigned int/static const unsigned int/' \
            NootedRed/PhoenixFirmwareGFXGenerated.hpp
      - name: Build research release
        run: xcodebuild -configuration "Research Release" -arch x86_64 build
      - name: Verify x86_64 kext
        run: |
          kext=$(find build -type d -name NootedRed.kext -print -quit)
          test -n "$kext"
          file "$kext/Contents/MacOS/NootedRed" | tee build/phoenix-binary.txt
          file "$kext/Contents/MacOS/NootedRed" | grep -q x86_64
          plutil -lint "$kext/Contents/Info.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: NootedRed-Phoenix-x86_64
          path: |
            build/**/*.zip
            Lilu/build/Debug/*.zip
            build/phoenix-binary.txt
          if-no-files-found: error
